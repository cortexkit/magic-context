name: Restore same-commit CI dists
description: Restore complete package output, checking its commit and archive digest
runs:
  using: composite
  steps:
    - uses: ./.github/actions/wait-ci-artifact
      id: wait
      with:
        artifact: ci-dists-${{ github.sha }}
        producer: Preflight (checks and dists)
        timeout-minutes: "10"
    # GitHub can list an artifact a few seconds before its download endpoint
    # serves it. The script retries that; actions/download-artifact fails at once
    # with "None of the provided artifact IDs were found".
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ARTIFACT_ID: ${{ steps.wait.outputs.artifact-id }}
      run: python3 scripts/download-ci-artifact.py --artifact-id "$ARTIFACT_ID" --path "$RUNNER_TEMP/ci-dists"
    - name: Verify and unpack
      shell: bash
      run: |
        cd "$RUNNER_TEMP/ci-dists"
        test "$(cat ci-dists.commit)" = "$GITHUB_SHA"
        sha256sum --check ci-dists.sha256
        tar -xzf ci-dists.tar.gz -C "$GITHUB_WORKSPACE"
        # The archive is verified against this checkout's commit. Refresh the entry
        # mtime so a newer checkout timestamp cannot masquerade as stale source bytes.
        touch "$GITHUB_WORKSPACE/packages/plugin/dist/index.js"
