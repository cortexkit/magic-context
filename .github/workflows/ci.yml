name: CI

on:
  push:
    # train/** runs the same checks on a train branch before it is fast-forwarded
    # onto master; required status checks on master are satisfied by that run.
    branches: [master, main, "train/**"]
  # The nightly run rechecks the Cargo graph pinned by Cargo.lock;
  # workflow_dispatch remains available for an operator-triggered run.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# A train branch gets pushed again with each merge, and every run is about twenty
# jobs against a shared runner limit, so a new push cancels the train's older run.
# master keeps every run, so a failure still names the commit that broke it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Pipeline shape on every push to master/main:
#
#   Consumers check out/install immediately, then wait for verified same-attempt artifacts.
#   preflight publishes complete dists before independent checks
#        ├─ unit suites and packaging smokes
#        ├─ Docker install smokes (independent of unit/host results)
#        ├─ host behavior (OC1: four whole-file shards; OC2: two)
#   Rust clippy and lib archive → lib partitions start immediately.
#   Rust integration/doctests/remaining crates consume dists.
#   Hermetic build → shards runs independently of preflight checks.
#   ci-summary always checks every required leg, including cancelled/skipped jobs.
#
# Two e2e layers cover different concerns:
#   - Docker e2e: fresh-install smoke (plugin loads, doctor clean, one mock turn writes DB rows
#     under cortexkit path with right harness). Catches packaging / install-flow regressions.
#   - Host e2e: behavior suite with byte-level wire assertions, multi-turn cache stability,
#     historian publish behavior, tag-owner collision, synthetic todowrite, cross-harness memory,
#     etc. Spawns real `opencode serve` / Pi subprocesses against an embedded mock provider.
#     Catches cache-stability + correctness regressions that the smoke layer cannot see.
#
# Docker e2e was previously in a separate workflow (e2e-docker.yml). Folding it here means
# every master/main push exercises all unit, Docker and host proofs. The
# Rust jobs run on every push and scheduled run. Pushes use Cargo.lock-pinned crates;
# the scheduled hermetic build additionally probes the subconscious default branch:
#
#   rust-crates          legacy-named aggregate for clippy, lib, integration,
#                        binary, doctest and remaining-workspace targets
#   e2e-rust-hermetic-build → e2e-rust-hermetic (9 shards)
#
# The mc-module integration tests always build ck-subc from its Cargo.lock revision.
# Hermetic push builds use that same revision; the nightly build intentionally builds
# subconscious default-branch HEAD and reports it as drift in the job summary.

jobs:
  preflight:
    name: Preflight (checks and dists)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build complete dists
        run: bash scripts/ci/preflight-build-complete-dists.sh
      - name: Check compiled contracts
        run: bash scripts/ci/preflight-check-compiled-contracts.sh
      - name: Package same-commit dists
        run: |
          tar -czf ci-dists.tar.gz packages/plugin/dist packages/pi-plugin/dist packages/cli/dist packages/retina-local-fs/dist packages/dashboard/dist tests/docker/.generated
          sha256sum ci-dists.tar.gz > ci-dists.sha256
          printf '%s\n' "$GITHUB_SHA" > ci-dists.commit
      - uses: actions/upload-artifact@v4
        with:
          name: ci-dists-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ci-dists.tar.gz
            ci-dists.sha256
            ci-dists.commit
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      # Consumers verify these same-commit dists, but need not wait for unrelated
      # checks. CI (required) still rejects any failed preflight check.
      - name: Layout, manifest and shard contracts
        if: ${{ !cancelled() }}
        run: bash scripts/ci/preflight-layout-manifest-and-shard-contracts.sh
      - name: Pins and lockfiles
        if: ${{ !cancelled() }}
        run: bash scripts/ci/preflight-pins-and-lockfiles.sh
      - name: Format check
        if: ${{ !cancelled() }}
        run: bash scripts/ci/preflight-format-check.sh
      - name: TypeScript typecheck
        if: ${{ !cancelled() }}
        run: bash scripts/ci/preflight-typescript-typecheck.sh
      - name: Lint
        if: ${{ !cancelled() }}
        run: bash scripts/ci/preflight-lint.sh
  check-docs-layout:
    name: Check (public documentation layout)
    runs-on: ubuntu-latest
    needs: [preflight]
    steps:
      - uses: actions/checkout@v5
      - name: Reject tracked ignored CortexKit files
        run: bash scripts/check-cortexkit-layout.sh
      - name: Reject internal documentation in docs
        run: bash scripts/check-docs-layout.sh
      - name: Exercise planted layout violations
        run: bash scripts/check-docs-layout.test.sh

  check-plugin-compat:
    name: Check (CLI, retina and packaging)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # node:sqlite (the Pi / OpenCode-Desktop SQLite backend) is only reachable
      # under Node, not Bun. Node 24 also strips the smoke script's inline TS.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: ./.github/actions/restore-ci-dists
        id: dists

      - name: Test (CLI and retina, normal and debug assertions)
        # Bun has no --no-fail-fast flag. Collect package/mode statuses explicitly;
        # each package wrapper still owns its preload, JSC flags and timeout.
        run: bash scripts/ci/check-plugin-compat-test-cli-and-retina-normal-and-debug-assertions.sh
      # Exercise the node:sqlite branch of shared/sqlite.ts under REAL Node —
      # bun test only covers the bun:sqlite branch, so the transaction() shim,
      # readonly→readOnly mapping, and the array-bind normalization (#151) would
      # otherwise ship unverified on Pi/Desktop.
      - name: Smoke (node:sqlite backend)
        if: ${{ !cancelled() && steps.dists.outcome == 'success' }}
        run: bash scripts/ci/check-plugin-compat-smoke-node-sqlite-backend.sh

      # The smart-note QuickJS sandbox loads a ~1MB WASM. `bun test` runs it from
      # src (wasm resolves via node_modules), so it cannot catch a BUNDLING break
      # where the wasm isn't embedded in dist. This bundles sandbox-runner exactly
      # like the package build and runs a real check against the bundle.
      - name: Smoke (smart-note wasm bundle)
        if: ${{ !cancelled() && steps.dists.outcome == 'success' }}
        run: bash scripts/ci/check-plugin-compat-smoke-smart-note-wasm-bundle.sh

      # The raw-TSX ./tui entry imports @opentui/solid's JSX runtime. `bun test`
      # never imports it, so a missing/mismatched OpenTUI or Solid dep (as broke
      # on OpenCode 1.17.10's OpenTUI 0.4.2 bump) ships a TUI that won't load.
      # Import the entry the way OpenCode loads the ./tui export to catch it.
      - name: Smoke (TUI entry import)
        if: ${{ !cancelled() && steps.dists.outcome == 'success' }}
        run: bash scripts/ci/check-plugin-compat-smoke-tui-entry-import.sh

      # The dev-path import above cannot catch packaging breaks: OpenTUI's Solid
      # transform skips node_modules sources, so only a packed PROD install
      # exercises the resolution path OpenCode's plugin cache uses (v0.31.1
      # shipped without runtime deps and passed every dev-path check).
      - name: Smoke (TUI packaged install import)
        if: ${{ !cancelled() && steps.dists.outcome == 'success' }}
        run: bash scripts/ci/check-plugin-compat-smoke-tui-packaged-install-import.sh

      # Tokenizer loading is lazy, so an import-only smoke misses resolution
      # failures. Pack + npm-install prod deps, then exercise an estimate from a
      # compiled Bun host matching OpenCode's /$bunfs/root runtime.
      - name: Smoke (tokenizer packaged install estimate)
        if: ${{ !cancelled() && steps.dists.outcome == 'success' }}
        run: bash scripts/ci/check-plugin-compat-smoke-tokenizer-packaged-install-estimate.sh

  unit-plugin:
    name: Unit (plugin ${{ matrix.mode }} ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, assertions]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: ./.github/actions/restore-ci-dists
      - name: Run whole-file plugin shard
        env:
          UNIT_MODE: ${{ matrix.mode }}
        run: bash scripts/ci/unit-plugin-run-whole-file-plugin-shard.sh "${{ matrix.shard }}"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: unit-plugin-${{ matrix.mode }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: unit-junit.xml
          if-no-files-found: error

  slow-unit:
    name: Slow unit (${{ matrix.mode }})
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/heads/train/check-')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, assertions]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/restore-ci-dists
      - name: Run full corpora and isolated timing checks once per mode
        env:
          UNIT_MODE: ${{ matrix.mode }}
        run: bash scripts/ci/slow-unit-run-full-corpora-and-isolated-timing-checks-once-per-mode.sh
  unit-pi-plugin:
    name: Unit (pi-plugin ${{ matrix.mode }} ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, assertions]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - uses: ./.github/actions/restore-ci-dists
      - name: Run whole-file Pi shard
        env:
          UNIT_MODE: ${{ matrix.mode }}
        # Assertion shards keep one worker and the existing 60-second timeout.
        run: bash scripts/ci/unit-pi-plugin-run-whole-file-pi-shard.sh "${{ matrix.shard }}"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: unit-pi-plugin-${{ matrix.mode }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: unit-junit.xml
          if-no-files-found: error

  check-plugin:
    name: Check (plugin)
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [unit-plugin, check-plugin-compat]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Require plugin unit and packaging legs
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: bun packages/e2e-tests/scripts/check-ci-results.ts check-plugin

  check-pi-plugin:
    name: Check (pi-plugin)
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [unit-pi-plugin]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Require Pi unit legs
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: bun packages/e2e-tests/scripts/check-ci-results.ts check-pi-plugin

  check-dashboard:
    name: Check (dashboard)
    runs-on: ubuntu-latest
    needs: [preflight]
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Frontend-only checks (no Rust/Tauri needed). The key gate is the test
      # step, which runs config-parity.test.ts — it fails the build if the
      # plugin config schema gains/renames/removes a field the dashboard's
      # ConfigEditor coverage manifest doesn't account for, so the form can't
      # silently drift out of sync with the schema again.
      - name: Test
        run: bash scripts/ci/check-dashboard-test.sh

  e2e-opencode:
    name: E2E (OpenCode, Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - uses: ./.github/actions/restore-ci-dists

      - name: Build E2E image
        run: bash scripts/ci/e2e-opencode-build-e2e-image.sh
      - name: Run E2E
        run: bash scripts/ci/e2e-opencode-run-e2e.sh

  e2e-opencode2:
    name: E2E (OpenCode 2.0.22, Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - uses: ./.github/actions/restore-ci-dists

      # The wrapper is the single local/CI entrypoint. It builds the publishable
      # plugin, fails if Docker or opencode2 is missing, and runs the exact-pinned
      # GA host through a real transform, host fold, database check, and TUI boot.
      - name: Run pinned OpenCode 2 container lane
        run: bash scripts/ci/e2e-opencode2-run-pinned-opencode-2-container-lane.sh

  e2e-pi:
    name: E2E (Pi, Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - uses: ./.github/actions/restore-ci-dists

      - name: Build E2E image
        # The Pi Dockerfile installs runtime deps fresh inside the image
        # (better-sqlite3 builds against linux/amd64), so no host-side
        # `npm install` is needed.
        run: bash scripts/ci/e2e-pi-build-e2e-image.sh
      - name: Run E2E
        run: bash scripts/ci/e2e-pi-run-e2e.sh

  e2e-omp:
    name: E2E (Oh My Pi, real Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - uses: ./.github/actions/restore-ci-dists

      - name: Build real OMP E2E image
        run: bash scripts/ci/e2e-omp-build-real-omp-e2e-image.sh
      - name: Run real OMP install and session smoke
        run: bash scripts/ci/e2e-omp-run-real-omp-install-and-session-smoke.sh

  e2e-host-opencode:
    name: E2E (OpenCode, host behavior ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      # Install opencode the same way the Docker image does — the host
      # suite spawns `opencode serve` from PATH.
      - name: Install opencode
        # Float to LATEST (no --version) so CI exercises the opencode version
        # users actually run and catches upstream breakage as it ships — not at
        # our release time. (A fixed pin previously hid opencode 1.16's
        # post-overflow change, commit 7e09660c3, until release; the
        # overflow-recovery host test is now version-agnostic.) Trade-off: a
        # known-bad upstream release can turn CI red for unrelated PRs — if that
        # happens, temporarily re-pin with `--version X.Y.Z` here until it's
        # resolved upstream.
        run: bash scripts/ci/e2e-host-opencode-install-opencode.sh
      - name: Verify opencode on PATH
        run: bash scripts/ci/e2e-host-opencode-verify-opencode-on-path.sh

      - uses: ./.github/actions/restore-ci-dists
        id: dists

      # Strip inherited NODE_ENV=test so the spawned opencode subprocess
      # gets the same logging + runtime behavior as a normal local run
      # (documented in CONTRIBUTING / project memory).
      - name: Run host e2e suite (OpenCode tests only)
        env:
          NODE_ENV: ""
          MC_E2E_MODE: ts
          MC_E2E_HOST: opencode
        run: bash scripts/ci/e2e-host-opencode-run-host-e2e-suite-opencode-tests-only.sh "${{ matrix.shard }}"
      # This oracle is outside tests/**/*.test.ts and runs once even if a host suite fails.
      - name: Cache analysis oracle
        if: ${{ !cancelled() && matrix.shard == 0 && steps.dists.outcome == 'success' }}
        env:
          NODE_ENV: ""
          MC_E2E_MODE: ts
          MC_E2E_HOST: opencode
        run: bash scripts/ci/e2e-host-opencode-cache-analysis-oracle.sh

  e2e-host-pi:
    name: E2E (Pi, host behavior)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Pi tests resolve the Pi binary via createRequire against
      # @earendil-works/pi-coding-agent, which is a workspace dep of
      # packages/pi-plugin. `bun install` brings it in.
      - name: Install workspace deps
        run: bun install --frozen-lockfile

      # pi-cross-harness.test.ts spawns BOTH a Pi runner and an OpenCode
      # serve to verify cross-harness memory sharing, so this job needs
      # opencode on PATH too. Float to LATEST like the OpenCode host job
      # (see that step for the rationale + re-pin escape hatch).
      - name: Install opencode
        run: bash scripts/ci/e2e-host-pi-install-opencode.sh
      - name: Verify opencode on PATH
        run: bash scripts/ci/e2e-host-pi-verify-opencode-on-path.sh

      - uses: ./.github/actions/restore-ci-dists

      # Per-test timeout bumped to 300s for the same cold-start reason as
      # the OpenCode host job. Pi historian publish path also crosses an
      # HTTP boundary into the mock provider, which is slower on shared
      # runners than on local hardware.
      - name: Run host e2e suite (Pi tests from mode manifest)
        env:
          NODE_ENV: ""
          MC_E2E_MODE: ts
          MC_E2E_HOST: pi
        run: bash scripts/ci/e2e-host-pi-run-host-e2e-suite-pi-tests-from-mode-manifest.sh
  e2e-host-opencode2:
    name: E2E (OpenCode ${{ matrix.version }}, host behavior ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
        version: [2.0.22, 2.1.0]
    env:
      MC_E2E_OPENCODE2_VERSION: ${{ matrix.version }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The OpenCode 2 harness spawns the real GA host from @opencode/cli, a
      # workspace dev dependency whose postinstall unpacks the platform binary
      # (trustedDependencies at the workspace root lets bun run it).
      - name: Install workspace deps
        run: bun install --frozen-lockfile

      # The conversion regression boots both generations and doctor probes the
      # v1 CLI on PATH; the v2 binary comes from the pinned workspace dependency.
      # The installer one-liner resolves "latest" through the rate-limited GitHub API
      # and can exit 0 without installing; the repo's installer pins, retries and
      # asserts the binary runs.
      - name: Install OpenCode 1 for conversion coverage
        run: bash scripts/ci/e2e-host-opencode2-install-opencode-1-for-conversion-coverage.sh
      - name: Install the selected exact host
        run: bash scripts/ci/e2e-host-opencode2-install-the-selected-exact-host.sh "${{ matrix.version }}"
      - name: Verify the GA host binary
        run: bash scripts/ci/e2e-host-opencode2-verify-the-ga-host-binary.sh

      - uses: ./.github/actions/restore-ci-dists
        id: dists

      - name: Run host e2e suite (OpenCode 2 tests from mode manifest)
        env:
          NODE_ENV: ""
          MC_E2E_MODE: ts
          MC_E2E_HOST: opencode2
        run: bash scripts/ci/e2e-host-opencode2-run-host-e2e-suite-opencode-2-tests-from-mode-manifest.sh "${{ matrix.shard }}"
      # These long-lived dual-host fixtures manipulate separate throwaway stores,
      # but run sequentially to avoid contending with one another's live hosts.
      - name: Run OC2 conversion and marker regressions
        if: ${{ !cancelled() && matrix.shard == 0 && steps.dists.outcome == 'success' }}
        env:
          NODE_ENV: ""
          MC_E2E_MODE: ts
          MC_E2E_HOST: opencode2
        run: bash scripts/ci/e2e-host-opencode2-run-oc2-conversion-and-marker-regressions.sh
  e2e-host-omp:
    name: E2E (Oh My Pi, host behavior)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # OMP runs the same Pi plugin through Pi's extension API; the harness
      # resolves @oh-my-pi/pi-coding-agent (a workspace dev dependency) when
      # MC_E2E_HOST=omp.
      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Install opencode
        run: bash scripts/ci/e2e-host-omp-install-opencode.sh
      - uses: ./.github/actions/restore-ci-dists

      - name: Run host e2e suite (OMP tests from mode manifest)
        env:
          NODE_ENV: ""
          MC_E2E_MODE: ts
          MC_E2E_HOST: omp
        run: bash scripts/ci/e2e-host-omp-run-host-e2e-suite-omp-tests-from-mode-manifest.sh
  rust-mc-module-integration:
    name: Rust (mc-module integration)
    # mc-module integration tests build ck-subc from the locked source revision.
    # Published commons and subconscious crates resolve from this repository's
    # Cargo.lock, so there is no commons checkout or floating crate source here.
    #
    # Keep daemon tests under libtest: its process-local build locks must not be
    # multiplied by nextest's process-per-test execution model.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MC_TEST_SUBCONSCIOUS_SOURCE: ${{ github.workspace }}/.siblings/subconscious
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # The hostless-store integration test provisions context.db through the CLI.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install CLI dependencies
        run: bun install --frozen-lockfile

      - name: Resolve Cargo.lock crate pins
        id: cargo-pins
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cargo-lock-pins.py --self-test
          pins="$(python3 scripts/cargo-lock-pins.py)"
          printf '%s\n' "$pins" >> "$GITHUB_OUTPUT"
          locked_crates="$(printf '%s\n' "$pins" | sed -n 's/^locked_crates=//p')"
          echo "Cargo.lock pins: $locked_crates" >> "$GITHUB_STEP_SUMMARY"

      # real_daemon.rs builds ck-subc and checks its launch-nonce history; this
      # exact locked checkout is therefore needed only by this integration-test job.
      - name: Check out locked subconscious source for daemon integration tests
        uses: actions/checkout@v5
        with:
          repository: cortexkit/subconscious
          path: .siblings/subconscious
          ref: ${{ steps.cargo-pins.outputs.subc_revision }}
          fetch-depth: 0

      - uses: ./.github/actions/restore-ci-dists
      - name: Build system-delivery fixture test binary
        shell: bash
        run: bash scripts/ci/rust-mc-module-integration-build-system-delivery-fixture-test-binary.sh
      - name: Run system-prompt-delivery integration test
        run: bash scripts/ci/rust-mc-module-integration-run-system-prompt-delivery-integration-test.sh
      - name: Test mc-module (integration, binary and doctest targets)
        run: bash scripts/ci/rust-mc-module-integration-test-mc-module-integration-binary-and-doctest-targets.sh
  rust-clippy:
    name: Rust (clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy (including integration targets)
        run: bash scripts/ci/rust-clippy-clippy-including-integration-targets.sh

  rust-workspace-crates:
    name: Rust (remaining crates)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install workspace dependencies for migration-oracle tests
        run: bun install --frozen-lockfile
      - uses: ./.github/actions/restore-ci-dists
      - name: Test the remaining workspace crates
        run: bash scripts/ci/rust-workspace-crates-test-the-remaining-workspace-crates.sh

  rust-lib-archive:
    name: Rust (mc-module lib archive)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.138
      - name: Compile the complete lib once and prove inventory equality
        run: bash scripts/ci/rust-lib-archive-compile-the-complete-lib-once-and-prove-inventory-equality.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rust-lib-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-rust-lib/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  rust-mc-module-lib:
    name: Rust (mc-module lib ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # The cap includes at most 45 minutes waiting plus the original execution allowance.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.138
      - uses: ./.github/actions/wait-ci-artifact
        id: archive
        with:
          artifact: rust-lib-${{ github.sha }}
          producer: Rust (mc-module lib archive)
          timeout-minutes: "45"
      - name: Download lib archive (retry transient failures and verify digest)
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.archive.outputs.artifact-id }}
        run: python3 scripts/download-ci-artifact.py --artifact-id "$ARTIFACT_ID" --path ci-rust-lib
      - name: Verify archive provenance
        run: |
          if [[ ! -f "ci-rust-lib/lib-${{ matrix.shard }}-names.txt" || ! -f ci-rust-lib/archive.tar.zst || ! -f ci-rust-lib/archive.sha256 || ! -f ci-rust-lib/commit.txt || ! -f ci-rust-lib/rustc.txt ]]; then
            echo "::error::artifact not downloaded: missing Rust lib archive files for shard ${{ matrix.shard }}" >&2
            exit 1
          fi
          test "$(cat ci-rust-lib/commit.txt)" = "$GITHUB_SHA"
          sha256sum --check ci-rust-lib/archive.sha256
          rustc -vV | diff - ci-rust-lib/rustc.txt
      - name: Run lib partition
        run: bash scripts/ci/rust-mc-module-lib-run-lib-partition.sh "${{ matrix.shard }}"
      - name: Check every selected test executed
        if: ${{ !cancelled() }}
        run: bash scripts/ci/rust-mc-module-lib-check-every-selected-test-executed.sh "${{ matrix.shard }}"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: rust-lib-results-${{ matrix.shard }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: error

  rust-crates:
    name: Rust (crates)
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [preflight, rust-clippy, rust-lib-archive, rust-mc-module-lib, rust-mc-module-integration, rust-workspace-crates]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Require every Rust leg
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: bun packages/e2e-tests/scripts/check-ci-results.ts rust-crates

  e2e-rust-hermetic-build:
    name: E2E (Rust hermetic build)
    # Cargo.lock pins the published crate versions and both git dependency revisions.
    # On schedule the daemon checkout below intentionally switches to upstream HEAD.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve Cargo.lock crate pins
        id: cargo-pins
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cargo-lock-pins.py --self-test
          pins="$(python3 scripts/cargo-lock-pins.py)"
          printf '%s\n' "$pins" >> "$GITHUB_OUTPUT"
          locked_crates="$(printf '%s\n' "$pins" | sed -n 's/^locked_crates=//p')"
          echo "Cargo.lock pins: $locked_crates" >> "$GITHUB_STEP_SUMMARY"

      # Cargo can resolve subc-core as a library dependency but does not build its
      # ck-subc binary target. Pushes use the root lockfile revision; only the scheduled
      # run deliberately checks the subconscious default branch for upstream drift.
      - name: Check out Cargo.lock-pinned subconscious source for ck-subc
        if: ${{ github.event_name != 'schedule' }}
        uses: actions/checkout@v5
        with:
          repository: cortexkit/subconscious
          path: .siblings/subconscious
          ref: ${{ steps.cargo-pins.outputs.subc_revision }}

      - name: Check out subconscious default branch for scheduled drift
        if: ${{ github.event_name == 'schedule' }}
        uses: actions/checkout@v5
        with:
          repository: cortexkit/subconscious
          path: .siblings/subconscious

      - name: Record ck-subc source revision
        id: daemon-source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git -C "$GITHUB_WORKSPACE/.siblings/subconscious" rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            summary="ck-subc source drift: subconscious default-branch HEAD $sha"
          else
            summary="ck-subc source pinned by Cargo.lock: $sha"
          fi
          echo "$summary"
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Derive hermetic Cargo cache key
        id: cargo-cache-key
        shell: bash
        run: |
          set -euo pipefail
          # Key on the resolved Cargo graph plus the exact daemon source, including
          # nightly HEAD, so pinned and drift builds never reuse one another's cache.
          lock_digest="$(sha256sum Cargo.lock | awk '{print $1}')"
          source_sha="${{ steps.daemon-source.outputs.sha }}"
          digest="$(printf '%s\n%s\n' "$lock_digest" "$source_sha" | sha256sum | awk '{print $1}')"
          echo "key=rust-hermetic-${RUNNER_OS}-${RUNNER_ARCH}-${digest}" >> "$GITHUB_OUTPUT"

      - name: Restore ck-subc and ckdev-mc-e2e Cargo target cache
        uses: actions/cache@v4
        with:
          path: packages/e2e-tests/.cache/rust-e2e-cargo-target
          key: ${{ steps.cargo-cache-key.outputs.key }}

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build hermetic binary pair (including fault-injection variant)
        shell: bash
        run: bash scripts/ci/e2e-rust-hermetic-build-build-hermetic-binary-pair-including-fault-injection-variant.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rust-hermetic-binaries-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rust-hermetic-binaries.tar.gz
            ${{ runner.temp }}/rust-hermetic-binaries.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  e2e-rust-hermetic:
    name: E2E (Rust hermetic ${{ matrix.shard }}/9)
    runs-on: ubuntu-latest
    # Artifact waits allow 30 minutes of queue time beyond the producer timeout; tests retain their own timeouts.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Install pinned OpenCode
        run: bash scripts/ci/e2e-rust-hermetic-install-pinned-opencode.sh
      - uses: ./.github/actions/restore-ci-dists
      - uses: ./.github/actions/wait-ci-artifact
        id: binaries
        with:
          artifact: rust-hermetic-binaries-${{ github.sha }}
          producer: E2E (Rust hermetic build)
          timeout-minutes: "120"
      - name: Download hermetic binaries (retry transient failures and verify digest)
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.binaries.outputs.artifact-id }}
        run: python3 scripts/download-ci-artifact.py --artifact-id "$ARTIFACT_ID" --path "$RUNNER_TEMP/hermetic-artifact"
      - name: Restore executable and auxiliary binaries
        run: |
          if [[ ! -f "$RUNNER_TEMP/hermetic-artifact/rust-hermetic-binaries.tar.gz" || ! -f "$RUNNER_TEMP/hermetic-artifact/rust-hermetic-binaries.sha256" ]]; then
            echo "::error::artifact not downloaded: missing hermetic binaries archive or checksum" >&2
            exit 1
          fi
          (cd "$RUNNER_TEMP/hermetic-artifact" && sha256sum --check rust-hermetic-binaries.sha256)
          mkdir -p packages/e2e-tests/.cache/prebuilt
          tar -xzf "$RUNNER_TEMP/hermetic-artifact/rust-hermetic-binaries.tar.gz" -C packages/e2e-tests/.cache/prebuilt
          test "$(cat packages/e2e-tests/.cache/prebuilt/commit.txt)" = "$GITHUB_SHA"
          for binary in ckdev-mc-e2e ckdev-mc-e2e-drive-fault ckdev-subc; do
            test -x "packages/e2e-tests/.cache/prebuilt/$binary"
          done
      - name: Run manifest shard
        env:
          MC_E2E_SHARD: ${{ matrix.shard }}/9
          MC_E2E_CK_MC_PREBUILT_BIN: ${{ github.workspace }}/packages/e2e-tests/.cache/prebuilt/ckdev-mc-e2e
          MC_E2E_CK_MC_DRIVE_FAULT_BIN: ${{ github.workspace }}/packages/e2e-tests/.cache/prebuilt/ckdev-mc-e2e-drive-fault
          MC_E2E_CK_SUBC_BIN: ${{ github.workspace }}/packages/e2e-tests/.cache/prebuilt/ckdev-subc
        run: bash scripts/ci/e2e-rust-hermetic-run-manifest-shard.sh

  rust-raw-replay-review:
    name: Rust (raw replay review)
    runs-on: ubuntu-latest
    needs: [e2e-rust-hermetic-build]
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - uses: ./.github/actions/wait-ci-artifact
        id: binaries
        with:
          artifact: rust-hermetic-binaries-${{ github.sha }}
          producer: E2E (Rust hermetic build)
          timeout-minutes: "120"
      - name: Download hermetic binaries (retry transient failures and verify digest)
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.binaries.outputs.artifact-id }}
        run: python3 scripts/download-ci-artifact.py --artifact-id "$ARTIFACT_ID" --path "$RUNNER_TEMP/raw-replay-download"
      - name: Restore staged native driver
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$RUNNER_TEMP/raw-replay-download/rust-hermetic-binaries.tar.gz" || ! -f "$RUNNER_TEMP/raw-replay-download/rust-hermetic-binaries.sha256" ]]; then
            echo "::error::artifact not downloaded: missing raw replay binaries archive or checksum" >&2
            exit 1
          fi
          (cd "$RUNNER_TEMP/raw-replay-download" && sha256sum --check rust-hermetic-binaries.sha256)
          mkdir -p "$RUNNER_TEMP/raw-replay-artifact"
          tar -xzf "$RUNNER_TEMP/raw-replay-download/rust-hermetic-binaries.tar.gz" -C "$RUNNER_TEMP/raw-replay-artifact"
          test "$(cat "$RUNNER_TEMP/raw-replay-artifact/commit.txt")" = "$GITHUB_SHA"
          test -x "$RUNNER_TEMP/raw-replay-artifact/rust-raw-replay-probe"
      - name: Fetch pinned master baseline
        shell: bash
        run: bash scripts/ci/rust-raw-replay-review-fetch-pinned-master-baseline.sh
      - name: Run staged raw replay witnesses
        env:
          MC_RAW_REPLAY_REQUIRED: "1"
          MC_RAW_REPLAY_BASELINE_RELEASE: "1"
          MC_REVIEW_ASSERT_LIVENESS: "1"
          MC_RAW_REPLAY_PROBE: ${{ runner.temp }}/raw-replay-artifact/rust-raw-replay-probe
          MC_RAW_REPLAY_BASELINE_ARCHIVE: ${{ runner.temp }}/rust-raw-replay-baseline.tar
        run: bash scripts/ci/rust-raw-replay-review-run-staged-raw-replay-witnesses.sh
  ci-summary:
    name: CI (required)
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [preflight, check-docs-layout, check-plugin, check-pi-plugin, check-plugin-compat, unit-plugin, unit-pi-plugin, slow-unit, check-dashboard, e2e-opencode, e2e-opencode2, e2e-pi, e2e-omp, e2e-host-opencode, e2e-host-opencode2, e2e-host-pi, e2e-host-omp, rust-clippy, rust-lib-archive, rust-mc-module-lib, rust-mc-module-integration, rust-workspace-crates, rust-crates, e2e-rust-hermetic-build, e2e-rust-hermetic, rust-raw-replay-review]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Require every CI leg
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: bun packages/e2e-tests/scripts/check-ci-results.ts ci-summary
