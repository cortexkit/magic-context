name: CI (Windows Rust)

# Keep this separate while Windows is not required: the release gate checks
# the conclusion of the main CI workflow, not only its aggregate jobs.
#
# A push runs only the two native jobs (x64 and ARM64), which hold every
# assertion. The timing and trace jobs measure where time goes and assert
# nothing new, so they run only when someone starts the workflow by hand
# with `diagnostics` switched on.
on:
  push:
    branches: [master, main, "0.50", mode3-clean, "train/**"]
  workflow_dispatch:
    inputs:
      diagnostics:
        description: Also run the per-test timing job and the long-head trace job
        type: boolean
        default: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: never

jobs:
  rust-windows:
    name: Rust (Windows ${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-${{ matrix.target }}
      - name: Build and test the Rust workspace natively
        shell: bash
        # Leave time for the log upload if more than one command hits its limit.
        timeout-minutes: 165
        env:
          MC_WINDOWS_TARGET: ${{ matrix.target }}
          RUSTUP_TOOLCHAIN: stable-${{ matrix.target }}
        run: bash scripts/ci/rust-windows-build-and-test.sh
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: rust-windows-${{ matrix.target }}-${{ github.run_attempt }}
          path: target/windows-rust-logs/
          if-no-files-found: error

  rust-windows-lib-timing:
    name: Rust (Windows x64 lib timing)
    needs: rust-windows
    # Use a fresh runner after the matrix so the diagnostic cannot consume
    # either normal job's time budget or interfere with its test files.
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.diagnostics }}
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.138
      - name: Record per-test library times
        shell: bash
        timeout-minutes: 50
        env:
          RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
        run: bash scripts/ci/rust-windows-lib-timing.sh
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: rust-windows-x64-lib-timing-${{ github.run_attempt }}
          path: target/windows-rust-timing/
          if-no-files-found: error

  rust-windows-long-head:
    name: Rust (Windows x64 long-head scenario)
    needs: rust-windows
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.diagnostics }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - name: Trace the single long-head integration scenario
        shell: bash
        timeout-minutes: 35
        env:
          RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
        run: bash scripts/ci/rust-windows-long-head.sh
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: rust-windows-x64-long-head-${{ github.run_attempt }}
          path: target/windows-rust-long-head/
          if-no-files-found: error
