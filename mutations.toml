[[control]]
id = 'rs-nonstructural-retry-returns-current-candidate'
guards = 'a lost or late compaction answer cannot hide an independent rebuild: a non-structural retry returns the current candidate, not stale last_produced bytes'
file = 'crates/mc-module/src/transform.rs'
old = 'answer = Answer::Replacement(state.allocate(candidate)?);'
new = '''// NON-VACUITY BREAK: replay stale output instead of the current rebuild.
                let candidate = if rejected.is_some_and(|r| !r.structural) {
                    state.last_produced.clone().unwrap_or(candidate)
                } else {
                    candidate
                };
                answer = Answer::Replacement(state.allocate(candidate)?);'''
test_file = 'crates/mc-module/src/transform.rs'
runner = 'command'
