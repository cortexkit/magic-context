# Mutation proofs replayed by the pinned ck-mutate runner (README.md,
# "Mutation catalogue"). Each row deliberately breaks one production guard and
# names the test that must fail because of it. A row earns its place only by
# guarding a silent, costly failure: a prompt-cache bust, a refusal that must
# fail closed, a wire contract, crash safety, data loss, or file permissions.
# Every anchor was copied from the code, never written from memory; `ck-mutate
# check` fails the moment one stops matching exactly once.
#
# Bun rows are `command` rows. `{test}` is a Bun `-t` filter, which Bun reads as
# a regular expression over the full test name (describe names and the test
# name joined by single spaces). The ids are anchored (^...$) and escaped, with
# `\s` for each space because ck-mutate refuses whitespace in an id.
# `Ran {count} test` matches Bun's summary line ("Ran 1 test across 1 file."),
# proving the filter selected a test on both the clean and the mutated tree.
# Bun tests import the TypeScript sources, so no build step runs between
# mutants; run `bun install --frozen-lockfile` once before replaying.
#
# Rust rows in mc-module are `command` rows too: its lib target holds about
# 1,650 tests and takes far too long to replay whole for every mutant, so each
# row runs only its named test with `cargo test --lib -- --exact`. The count
# pattern `running {count} test` matches libtest's "running 1 test" line, and
# cargo rebuilds the mutant inside the same command. Small targets (mc-store's
# lib, one integration test binary) are ordinary `cargo` rows with `only = true`.
#
# Replay with the Bun version package.json pins (packageManager, bun 1.4.2).
# Never `git checkout` a file while a replay runs: it removes the mutation and
# fakes a survivor.

# --- cache stability: one bust permission, byte-identical defers ---
# ARCHITECTURE.md, load-bearing invariants 2-4: a defer (SOFT+) pass replays the
# served prefix byte for byte, and every mutation lane consults the one per-pass
# bust permission. Any break here is a silent prompt-cache bust: the provider
# answers normally and only the bill shows it.

[[control]]
id = 'ts-single-bust-permission-gates-first-applications'
guards = 'every first-application lane (age sweep, heuristics, strips, m[1] refresh) consults the one per-pass bust permission, so candidates alone never originate a bust'
file = 'packages/plugin/src/hooks/magic-context/transform-postprocess-phase.ts'
old = 'const isCacheBustingPass = publishedWorkDrainAllowed;'
new = 'const isCacheBustingPass = !compactionOff;'
test_file = 'packages/plugin/src/hooks/magic-context/transform-postprocess-phase.test.ts'
runner = 'command'
command = ['bun', 'test', 'packages/plugin/src/hooks/magic-context/transform-postprocess-phase.test.ts', '--timeout', '30000', '-t', '{test}']
test_count_pattern = 'Ran {count} test'
expect_red = ['^age\sand\sheuristic\scandidates\salone\sat\s75\spercent\scannot\soriginate\sa\sbust$']
expect_message = '{"id":"old-a","role":"assistant"},"parts":[]}'

