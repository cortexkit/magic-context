[package]
name = "mc-module"
version = "0.1.0"
edition = "2021"
publish = false
description = "The Magic Context subc module: harness-agnostic cache-stability transform (CK-in/CK-out), backed by the single-writer mc-store, served over the subc wire."

[lib]
name = "mc_module"
path = "src/lib.rs"

[[bin]]
# Fleet convention: supervised binaries carry the ck-* prefix so they group in
# Activity Monitor. Crate/package stays mc-module and module_id stays
# "magic-context" — only the built executable name changes.
name = "ck-mc"
path = "src/main.rs"

[dependencies]
mc-core = { workspace = true }
mc-store = { workspace = true }
mc-tokenizer = { path = "../mc-tokenizer" }
cortexkit-store-types = { workspace = true }
cortexkit-store = { workspace = true }
cortexkit-lease = { workspace = true }
cortexkit-log = { workspace = true }
tracing = "0.1"
subc-protocol = { workspace = true }
subc-control = { workspace = true }
subc-transport = { workspace = true }
subc-client-rs = { workspace = true }
subc-os = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Provider context-overflow error patterns (scheduler unit). Plain regex (no
# lookarounds in those patterns); fancy-regex stays confined to mc-tokenizer.
regex = "1"
tokio = { workspace = true }
sha2 = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The single-store writer opens the host's context.db directly (src/host_store.rs).
# Same pin as the workspace uses everywhere else so the Connection/Transaction types
# unify with mc-store's and cortexkit-store's.
rusqlite = { workspace = true }
# subc-protocol is resolved from crates.io, matching the role crate's dependency.
cortexkit-role-tool-provider = "=0.5.0"
cortexkit-role-compaction-provider = { git = "https://github.com/cortexkit/commons", rev = "9abd24916a087162b7650ad7db71cf287be1330c" }
cortexkit-role-step-transform-provider = { git = "https://github.com/cortexkit/commons", rev = "9abd24916a087162b7650ad7db71cf287be1330c" }
# RFC 8785 (JCS) canonical JSON for tool.catalog's answer bytes and digests: the
# same canonicaliser the role crate uses, so floats and non-ASCII keys in a
# caller's composition hash exactly as the runner hashes them.
serde_jcs = "0.2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["fs"] }

[features]
# Joint CC rig-drive fault injection. DEFAULT OFF.
#
# A default (deploy) build does not contain the corruption path at all: every line
# of fault code lives under `#[cfg(feature = "drive-fault")]` in src/lib.rs, so its
# ABSENCE from the shipped binary is the dormancy proof — there is no runtime-
# reachable arm that a stray env var could activate (a runtime-reachable corruption
# path was explicitly rejected: a forgotten var in prod would silently raw-fence
# every CC session forever). The drive builds a SEPARATE binary with
# `--features drive-fault`; that binary's only diff vs the deploy SHA is this flag,
# and under it MC_DRIVE_FAULT selects an arm (fingerprint_skew | omit_ck_messages |
# channel2_arm | transform_timeout) so a drive can select one fault without rebuilding.
#
# Do NOT add drive-fault to a default feature set, and do NOT add new fault arms
# without the matching absence-proof note here and the fault-shape tests in lib.rs.
# MC_PROVIDER_FAULT_POINT additionally parks at the six provider durable cuts
# declared in providers::FAULT_POINTS. The marker is printed only after
# the SQLite commit; the conformance harness then kills the process. This entire
# environment-controlled branch is absent from a default build.
drive-fault = []

[dev-dependencies]
cpu-time = "1"
subc-core = { workspace = true }
# Enable the store's seed helpers for mc-module's compose tests (populate memories +
# mutations). The feature is gated so the writers never reach production builds.
mc-store = { workspace = true, features = ["test-support"] }
tempfile = "3"
filetime = "0.2"
tracing-subscriber = "0.3"
rusqlite = { workspace = true }
# Parse the shipped-source census instead of mistaking comments for nonce readers.
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
async-trait = "0.1"
# The role's conformance suite, run in-process against tool.catalog and
# role.describe (src/tests/tool_catalog_conformance.rs).
cortexkit-role-tool-provider-conformance = "=0.5.0"
cortexkit-role-llm-runner-conformance = { git = "https://github.com/cortexkit/commons", rev = "9abd24916a087162b7650ad7db71cf287be1330c" }
