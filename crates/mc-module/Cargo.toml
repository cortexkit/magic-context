[package]
name = "mc-module"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "ck-mc"
description = "Magic Context as a compaction provider for llm-runners (ck-mc)."

[features]
# Opt-in measurement for the ignored large-store lock-budget test.
context-db-timing = ["rusqlite/hooks"]

[dependencies]
cortexkit-role-compaction = { workspace = true }
cortexkit-role-llm-runner = { workspace = true }
cortexkit-compaction-view = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
subc-client-rs = { workspace = true }
subc-protocol = { workspace = true }
regex = "1"
mc-tokenizer = { workspace = true }
rusqlite = { workspace = true }
sha2 = { workspace = true }
md5 = "0.7"
base64 = "0.22"
# The memory mural's PNG encoding (zlib), pure Rust.
miniz_oxide = "0.8"
# tool.catalog answers are RFC 8785 canonical JSON, byte for byte.
serde_jcs = "0.2"
# Model tool calls and the edit to a person's message come through these
# published contracts, each on a route of its own.
cortexkit-role-tool-provider = "=0.14.6"
cortexkit-role-step-transform-provider = "=0.5.0"
# Routing picks a summarizer model the session's own runner can run; ck-mc
# has no model chain of its own and never falls back to the session's model.
cortexkit-role-routing = "=0.5.7"
# Search query embeddings: one HTTPS POST per explicit search, no redirects.
# A session's memory context comes from Entorhinal, in these
# published request and reply types.
cortexkit-agent-identity = "=0.1.0"
cortexkit-project-identity = "=0.1.3"
# Profile versions compare as semantic versions.
semver = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
mc-mock-runner = { workspace = true }

[[bin]]
name = "ck-mc"
path = "src/main.rs"
