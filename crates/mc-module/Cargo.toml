[package]
name = "mc-module"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "ck-mc"
description = "Magic Context as a compaction provider for llm-runners (ck-mc)."

[features]
# Opt-in measurement for the ignored large-store lock-budget test.
context-db-timing = ["rusqlite/hooks"]
# Opt-in CPU attribution; ordinary builds compile the spans away.
notice-cost-timing = ["nix/resource", "nix/time"]
# Serve agent-data moves by default. Off, a release build never serves
# them, whatever MAGIC_CONTEXT_AGENT_DATA says; moves the journal already
# records are enforced either way (see `agent_data::switch`).
agent-data = []
# Share memories with the user's other computers through the hub's memory
# stream (`replica::live`), and run each owner's dreamer under its Entorhinal
# role lease (`dreamer::lease`). Off, ck-mc never starts the replica task,
# never contacts the hub and opens no lease watch; the store still records
# each change in its outbox, to be sent once a build with the feature runs
# (see `replica::FEATURE`), and those changes carry no lease epoch.
memory-replica = []
# Take the user's settings from the daemon's managed settings (subc's config
# gate): declare `assets/settings-schema.json`, rewrite a 0.49-shaped user file
# once before connecting, and read every setting from the view the daemon
# delivers. Off, ck-mc reads its two files exactly as before and declares
# nothing. No build turns it on yet: it waits until the daemon supports
# converting old settings files, and then turns on in one build together with
# ck-mc's own conversion.
managed-settings = ["dep:subc-config", "dep:subc-jsonc"]
# Opt-in heap attribution for the `heap_profile` test (allocation sites with
# backtraces). Only that test target requires it; no build of ck-mc turns it on.
heap-profile = ["dep:dhat"]

[dependencies]
# The heap profiler behind `heap-profile`.
dhat = { version = "0.3.3", optional = true }
# Local midnight for memories that end on a calendar date.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# The machine's IANA time zone name, which dreamer schedules run in.
iana-time-zone = "0.1.65"
cortexkit-log = { workspace = true }
cortexkit-paths = "=0.1.2"
cortexkit-persona = "=0.3.0"
tracing = "0.1"
cortexkit-role-compaction = { workspace = true }
cortexkit-role-llm-runner = { workspace = true }
cortexkit-compaction-view = { workspace = true }
serde = { workspace = true }
# `raw_value` lets a store save write cached JSON as is (`summary::head::SummaryItems`).
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { workspace = true }
subc-client-rs = { workspace = true }
subc-config = { workspace = true, optional = true }
subc-jsonc = { version = "=0.1.5", optional = true }
subc-protocol = { workspace = true }
# Only the registration live suite's helper binaries use it directly; ck-mc
# reaches it through subc-client-rs.
subc-os = { workspace = true }
regex = "1"
mc-tokenizer = { workspace = true }
cortexkit-tokens = { workspace = true }
rusqlite = { workspace = true }
sha2 = { workspace = true }
md5 = "0.7"
base64 = "0.22"
# The memory mural's PNG encoding (zlib), pure Rust.
miniz_oxide = "0.8"
# The memory mural draws a cue character its font lacks as the character's
# compatibility decomposition (an accented letter as its base letter).
unicode-normalization = "0.1.24"
# tool.catalog answers are RFC 8785 canonical JSON, byte for byte.
serde_jcs = "0.2"
# Model tool calls and the edit to a person's message come through these
# published contracts, each on a route of its own.
cortexkit-role-tool-provider = "=0.15.12"
cortexkit-role-step-transform-provider = "=0.5.0"
# Routing picks a summarizer model the session's own runner can run; ck-mc
# has no model chain of its own and never falls back to the session's model.
cortexkit-role-routing = "=0.7.23"
# A session moves between machines through the agent-data/v1 contract.
cortexkit-role-agent-data = "=0.3.3"
cortexkit-role-user-commands = "=0.1.4"
# Search query embeddings: one HTTPS POST per explicit search, no redirects.
# A session's memory context comes from Entorhinal, in these
# published request and reply types.
cortexkit-agent-identity = "=0.1.3"
cortexkit-project-identity = "=0.1.5"
# Profile versions compare as semantic versions.
semver = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# The module publishes its bus events itself, as Plexus does (`bus.rs`): a
# NATS credential from ck-bus, a JetStream publish, the fleet's subject names.
cortexkit-bus-nats = "=0.5.6"
cortexkit-bus-trait = "=0.3.1"
cortexkit-bus-naming = "=0.5.4"
# The computer's box id (`BusClient::box_id`), which names every memory this
# computer shares with the user's other computers (`replica/`).
cortexkit-bus-client = "=0.1.14"
# API keys the user names as `{vault:<credential id>}` are read from the
# CortexKit vault over ck-mc's own SDK consumer (`vault.rs`), and shared
# memories are sealed and opened under the fleet epoch key with its typed
# fleet epoch calls (`replica/seal.rs`).
cortexkit-claustrum-client = "=0.14.0"
# The run-end reader (`run_ends.rs`) binds its durable and pulls its events
# with async-nats directly: cortexkit-bus-nats binds a module's cursor only to
# the durable `m_{module}`.
async-nats = { version = "0.50", default-features = false, features = ["jetstream"] }
futures-util = { version = "0.3.34", default-features = false }
async-trait = "0.1"
# Credential tokens are wiped from memory when dropped.
zeroize = "1"

[target.'cfg(unix)'.dependencies]
# `time`: the monotonic clock a dreamer run reads its role lease's acting
# window on (`dreamer::lease::monotonic_ms`).
nix = { version = "0.31.3", features = ["fs", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", default-features = false, features = ["Win32_Storage_FileSystem", "Win32_System_SystemInformation"] }

[dev-dependencies]
cortexkit-role-tool-provider-conformance = "=0.15.13"
rusqlite = { workspace = true, features = ["trace"] }
tokio = { workspace = true, features = ["test-util"] }
# The contract's published vectors, for the participant's own tests.
cortexkit-role-agent-data = { version = "=0.3.3", features = ["test-vectors"] }
mc-mock-runner = { workspace = true }
tempfile = "3"
filetime = "0.2"
tracing-subscriber = "0.3"
# The vault's fleet epoch cipher, so the replica tests seal and open as the
# vault does (XChaCha20-Poly1305) and check its published samples.
chacha20poly1305 = "0.10"
# An in-memory bus for the notice publisher's tests.
cortexkit-bus-inmemory = "=0.3.2"
# The registration live suite (tests/registration_live.rs): an in-process
# daemon that supervises the real ck-mc binary, the wire it is driven over,
# and scratch homes fenced away from the operator's own.
subc-daemon = { workspace = true }
subc-jsonc = "=0.1.5"
subc-control = { workspace = true }
subc-transport = { workspace = true }
cortexkit-test-support = "=0.1.14"

[[bin]]
name = "ck-mc"
path = "src/main.rs"

# Measures what the module holds in memory after Setup, on a copy of real
# stores. It replaces the global allocator, so its body compiles only with the
# feature (`#![cfg]` in the file; without it the target is empty, and a
# `--test '*'` run passes over it):
# `cargo test -p mc-module --release --features heap-profile --test heap_profile -- --ignored --nocapture`.
[[test]]
name = "heap_profile"
path = "tests/heap_profile.rs"

# Test-only helpers the registration live suite's daemon launches. None of
# them is shipped: releases take target/release/ck-mc alone.
[[bin]]
name = "mc-test-nonce-holder"
path = "tests/support/nonce_holder.rs"
test = false
bench = false

[[bin]]
name = "mc-test-nonce-launcher"
path = "tests/support/nonce_launcher.rs"
test = false
bench = false

[[bin]]
name = "mc-test-privacy-trampoline"
path = "tests/support/privacy_trampoline.rs"
test = false
bench = false
