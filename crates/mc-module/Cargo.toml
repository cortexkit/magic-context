[package]
name = "mc-module"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "ck-mc"
description = "Magic Context as a compaction provider for llm-runners (ck-mc)."

[features]
# Opt-in measurement for the ignored large-store lock-budget test.
context-db-timing = ["rusqlite/hooks"]
# Opt-in CPU attribution; ordinary builds compile the spans away.
notice-cost-timing = ["nix/resource", "nix/time"]
# Serve agent-data moves by default. Off, a release build never serves
# them, whatever MAGIC_CONTEXT_AGENT_DATA says; moves the journal already
# records are enforced either way (see `agent_data::switch`).
agent-data = []

[dependencies]
# Local midnight for memories that end on a calendar date.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# The machine's IANA time zone name, which dreamer schedules run in.
iana-time-zone = "0.1.65"
cortexkit-log = { workspace = true }
cortexkit-persona = "=0.3.0"
tracing = "0.1"
cortexkit-role-compaction = { workspace = true }
cortexkit-role-llm-runner = { workspace = true }
cortexkit-compaction-view = { workspace = true }
serde = { workspace = true }
# `raw_value` lets a store save write cached JSON as is (`summary::head::SummaryItems`).
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { workspace = true }
subc-client-rs = { workspace = true }
subc-protocol = { workspace = true }
regex = "1"
mc-tokenizer = { workspace = true }
cortexkit-tokens = { workspace = true }
rusqlite = { workspace = true }
sha2 = { workspace = true }
md5 = "0.7"
base64 = "0.22"
# The memory mural's PNG encoding (zlib), pure Rust.
miniz_oxide = "0.8"
# tool.catalog answers are RFC 8785 canonical JSON, byte for byte.
serde_jcs = "0.2"
# Model tool calls and the edit to a person's message come through these
# published contracts, each on a route of its own.
cortexkit-role-tool-provider = "=0.15.7"
cortexkit-role-step-transform-provider = "=0.5.0"
# Routing picks a summarizer model the session's own runner can run; ck-mc
# has no model chain of its own and never falls back to the session's model.
cortexkit-role-routing = "=0.7.23"
# A session moves between machines through the agent-data/v1 contract.
cortexkit-role-agent-data = "=0.3.0"
cortexkit-role-user-commands = "=0.1.2"
# Search query embeddings: one HTTPS POST per explicit search, no redirects.
# A session's memory context comes from Entorhinal, in these
# published request and reply types.
cortexkit-agent-identity = "=0.1.3"
cortexkit-project-identity = "=0.1.4"
# Profile versions compare as semantic versions.
semver = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", default-features = false, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
cortexkit-role-tool-provider-conformance = "=0.15.8"
rusqlite = { workspace = true, features = ["trace"] }
tokio = { workspace = true, features = ["test-util"] }
# The contract's published vectors, for the participant's own tests.
cortexkit-role-agent-data = { version = "=0.3.0", features = ["test-vectors"] }
mc-mock-runner = { workspace = true }
tempfile = "3"
filetime = "0.2"
tracing-subscriber = "0.3"

[[bin]]
name = "ck-mc"
path = "src/main.rs"
