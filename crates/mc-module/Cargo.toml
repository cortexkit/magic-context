[package]
name = "mc-module"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "ck-mc"
description = "Magic Context as a compaction provider for llm-runners (ck-mc)."

[dependencies]
ck-contract-draft = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
subc-client-rs = { workspace = true }
subc-protocol = { workspace = true }
regex = "1"
mc-tokenizer = { workspace = true }
rusqlite = { workspace = true }

[dev-dependencies]
mc-mock-runner = { workspace = true }
sha2 = { workspace = true }

[[bin]]
name = "ck-mc"
path = "src/main.rs"
