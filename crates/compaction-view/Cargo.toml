[package]
name = "cortexkit-compaction-view"
version = "0.1.0"
edition = "2021"
# Not yet on crates.io: how it is published is still being settled.
publish = false
description = "The view library of the CortexKit compaction contract: how a runner renders a view and checks it, shared by runners and compaction providers so they never compute it differently."
license = "MIT"

[lib]
name = "compaction_view"

[dependencies]
cortexkit-role-compaction = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
