[package]
name = "mc-store"
version = "0.1.0"
edition = "2021"
publish = false
description = "Magic Context durable cache-state store: per-session CoreState + module_meta with an app-level row_version CAS inside cortexkit-store's epoch-fenced transaction."

[lib]
name = "mc_store"
path = "src/lib.rs"

[dependencies]
cortexkit-cache-core = { workspace = true }
cortexkit-store = { workspace = true }
cortexkit-store-types = { workspace = true }
rusqlite = { workspace = true, features = ["functions", "hooks"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = { workspace = true }
md5 = "0.7"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tracing = "0.1"

[features]
# Public seed helpers for sibling crates' tests (mc-module composes over this store
# and needs to populate it). Gated so the writers never ship in production builds.
test-support = []

[dev-dependencies]
tempfile = "3"
