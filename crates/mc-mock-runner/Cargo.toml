[package]
name = "mc-mock-runner"
version = "0.1.0"
edition = "2021"
publish = false
description = "Reference llm-runner for the mode-3 contract draft, with mock model providers, used to test a compaction provider end to end."

[dependencies]
ck-contract-draft = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subc-client-rs = { workspace = true }
subc-protocol = { workspace = true }
tokio = { workspace = true }
# Model tool calls and the edit to a person's message come through these
# published contracts, each on a route of its own.
cortexkit-role-tool-provider = "=0.14.6"
cortexkit-role-step-transform-provider = "=0.4.2"

[[bin]]
name = "ck-mock-runner"
path = "src/main.rs"
