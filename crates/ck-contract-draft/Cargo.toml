[package]
name = "ck-contract-draft"
version = "0.8.0-draft.1"
edition = "2021"
publish = false
description = "Local draft of the cleaned llm-runner and compaction-provider contracts (0.8.0). SUBC publishes the final version in commons once the mock runner passes."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# Checksums: llm-runner's shared RFC 8785 content digest (W7).
cortexkit-role-llm-runner = "=0.7.48"
# Names the field a request failed to decode at (`invalid_params`).
serde_path_to_error = "0.1"
