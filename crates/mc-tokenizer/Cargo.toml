[package]
name = "mc-tokenizer"
version = "0.49.25"
edition = "2021"
publish = false
description = "Claude BPE token estimator for Magic Context: a bit-faithful Rust port of ai-tokenizer's claude encoding (tiktoken byte-BPE), used for m0 budget fitting."

[lib]
name = "mc_tokenizer"
path = "src/lib.rs"

[dependencies]
# tiktoken byte-BPE engine. We build a CoreBPE from the vendored claude vocab
# (assets/claude.tiktoken) + the claude pat_str and use count_ordinary, which
# matches ai-tokenizer's estimateTokens (encode(_, "all") = byte-BPE, no specials).
# Pinned: 0.11 is the first version with count_ordinary. Determinism across
# resumes depends on the SAME tiktoken-rs + fancy-regex versions (Unicode-category
# behavior), so treat a bump as a renderer change (Cargo.lock is the pin).
tiktoken-rs = "=0.11.0"
# base64 decodes the vendored asset's token bytes; rustc-hash's FxHashMap is the
# map type CoreBPE::new requires, so we must match tiktoken-rs's rustc-hash major
# (1.x) or the map types won't unify.
base64 = "0.22"
rustc-hash = "1.1"

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
