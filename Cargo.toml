# Magic Context Rust workspace — the harness-agnostic MC module (CK-in / CK-out)
# that runs under the subc daemon. Lives in-repo alongside the bun `packages/`
# (the session/tooling is cwd-bound, and the build needs this repo's cache-stability
# context); the dashboard's Tauri crate is its own standalone build, excluded here.
[workspace]
resolver = "2"
# The mode-3 rewrite starts from an empty crates/ directory. The previous crates
# live in crates_old/ as a reference only and are not built.
members = ["crates/mc-mock-runner", "crates/mc-module", "crates/mc-tokenizer"]
exclude = ["packages/dashboard/src-tauri", "crates_old"]

# Commands the shared ck-motor build runner runs on the default branch to fill its
# dependency cache. Jobs hit the cache only when their dependency build shape
# (selected crates, features, profile) matches one of these.
[workspace.metadata.motor]
warm-commands = [
    "cargo build --locked --workspace --all-targets",
    "cargo test --locked -p mc-module --lib --no-run",
    "cargo clippy --locked -p mc-module --all-targets",
]

[workspace.dependencies]
# Published commons crates use their current lockfile versions from crates.io.
# cache-core is not published, so pin the source to an immutable commit.
cortexkit-cache-core = { git = "https://github.com/cortexkit/commons", rev = "85c105dfc10dfcd02360ef31b07b4bc67dea41f8" }
cortexkit-store = "=0.2.4"
cortexkit-store-types = "=0.2.2"
cortexkit-lease = "=0.1.2"
cortexkit-log = { version = "=0.3.5", features = ["store-paths"] }
cortexkit-tokens = "0.1"

# Published subc wire/SDK crates use crates.io. subc-core is unpublished; this
# revision matches daemon 0.39.0. Historian, classifier and dream sessions receive
# their exact project directory through scopes rather than the opener's identity.
subc-protocol = "=0.34.1"
subc-control = "=0.34.0"
subc-transport = "=0.15.0"
subc-client-rs = "=0.33.0"
subc-os = "=0.1.26"
subc-core = { git = "https://github.com/cortexkit/subconscious", rev = "90295ece040258c77ea1f1f1d727109c5eaab13f" }


# The compaction contract (compaction-provider/v2, compaction-runner/v1).
cortexkit-role-compaction = "=0.2.7"
# Applies views and checks them against the provider rules; runners use the
# same library, so both sides render a view the same way.
cortexkit-compaction-view = "=0.1.6"
# session.send and run.result, which the compaction contract reuses.
cortexkit-role-llm-runner = "=0.8.9"

# Internal crates.
mc-tokenizer = { path = "crates/mc-tokenizer" }
mc-mock-runner = { path = "crates/mc-mock-runner" }

# Third-party. rusqlite pinned to the same version+features cortexkit-store uses so
# the Connection/Transaction types unify across the with_conn boundary.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = { version = "0.10", features = ["compress"] }

# Keep test safety checks while reducing CPU-heavy differential runtime.
[profile.ci-test]
inherits = "test"
opt-level = 1
debug = "line-tables-only"
debug-assertions = true
overflow-checks = true
